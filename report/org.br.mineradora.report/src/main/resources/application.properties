#Configuração do envio de vento ao Kafka
mp.messaging.incoming.proposal-channel.connector=smallrye-kafka
mp.messaging.incoming.proposal-channel.topic=proposal

mp.messaging.incoming.quotation-channel.connector=smallrye-kafka
mp.messaging.incoming.quotation-channel.topic=quotation

mp.messaging.connector.smallrye-kafka.bootstrap.servers=192.168.56.1:19092

# Configuração dp datasource
quarkus.datasource.db-king=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=1234
quarkus.datasource.jdbc.url=jdbc:postgresql://192.168.56.1:5432/report_db
quarkus.hibernate-orm.database.generation=update

#quarkus.http.port=8092
#dev.quarkus.http.port=8882

# Configuração da segurança com keycloak
quarkus.oidc.auth-server-url=http://192.168.56.1:8081/realms/quarkus
quarkus.oidc.client-id=backend-service
quarkus.oidc.credentials.secret=secret

#https://quarkus.io/guides/opentelemetry
quarkus.otel.metrics.enabled=true
quarkus.otel.logs.enabled=true
quarkus.application.name=report 
quarkus.otel.exporter.otlp.endpoint=http://192.168.56.1:4317
#quarkus.otel.exporter.otlp.headers=authorization=Bearer my_secret 
quarkus.log.console.format=%d{HH:mm:ss} %-5p traceId=%X{traceId}, parentId=%X{parentId}, spanId=%X{spanId}, sampled=%X{sampled} [%c{2.}] (%t) %s%e%n  