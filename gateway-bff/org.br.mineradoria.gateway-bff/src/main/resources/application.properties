#quarkus.http.port=8095
#dev.quarkus.http.port=8885

# Configuração da segurança com keycloak
quarkus.oidc.auth-server-url=http://192.168.56.1:8081/realms/quarkus
quarkus.oidc.client-id=backend-service
quarkus.oidc.credentials.secret=secret

quarkus.oidc-client.auth-server-url=${quarkus.oidc.auth-server-url}
quarkus.oidc-client.client-id=${quarkus.oidc.client-id}
quarkus.oidc-client.credentials.secret=${quarkus.oidc.credentials.secret}

#Rest client Configuration com quarkus-rest-client-oidc-token-propagation
org.br.mineradoria.gateway.client.ProposalClient/mp-rest/url=http://br-mineradora-proposal:8080
org.br.mineradoria.gateway.client.ReportClient/mp-rest/url=http://br-mineradora-report:8080

# Rest client configuração
quarkus.rest-client."org.br.mineradoria.gateway.client.OAuthClient".url=http://192.168.56.1:8081

quarkus.log.category."org.br.mineradoria.gateway.filter.LoggingFilter".level=FINER

quarkus.log.category."org.quarkus.oidc".level=DEBUG


# Enable logging of request and response scope (line, headers, and body)
#quarkus.rest-client.logging.scope=request-response

# Truncate logged body after N characters (e.g., 1024)
#quarkus.rest-client.logging.body-limit=1024

# Set the log level to DEBUG for the REST client logging category
#quarkus.log.category."org.jboss.resteasy.reactive.client.logging".level=DEBUG


#https://pt.quarkus.io/guides/openapi-swaggerui
quarkus.swagger-ui.always-include = true
quarkus.smallrye-openapi.info-description = BR mineradora : Trade de Minerio

#https://quarkus.io/guides/opentelemetry
quarkus.otel.metrics.enabled=true
quarkus.otel.logs.enabled=true
quarkus.application.name=gateway-bff 
quarkus.otel.exporter.otlp.endpoint=http://192.168.56.1:4317
#quarkus.otel.exporter.otlp.headers=authorization=Bearer my_secret 
quarkus.log.console.format=%d{HH:mm:ss} %-5p traceId=%X{traceId}, parentId=%X{parentId}, spanId=%X{spanId}, sampled=%X{sampled} [%c{2.}] (%t) %s%e%n  