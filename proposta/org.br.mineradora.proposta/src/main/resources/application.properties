quarkus.http.port=8091
#dev.quarkus.http.port=8001

#Configuração do envio de vento ao Kafka
mp.messaging.outgoing.proposal-channel.connector=smallrye-kafka
mp.messaging.outgoing.proposal-channel.topic=proposal
mp.messaging.connector.smallrye-kafka.bootstrap.servers=localhost:19092

# Configuração dp datasource
quarkus.datasource.db-king=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=1234
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/proposal_db
quarkus.hibernate-orm.database.generation=update



# Configuração da segurança com keycloak
quarkus.oidc.auth-server-url=http://localhost:8081/realms/quarkus
quarkus.oidc.client-id=backend-service
quarkus.oidc.credentials.secret=secret

quarkus.log.category."org.br.mineradora.proposta.filter.LoggingFilter".level=INFO